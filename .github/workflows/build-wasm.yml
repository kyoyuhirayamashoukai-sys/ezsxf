name: Build WASM (Pyodide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.45'
          actions-cache-folder: 'emsdk-cache'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install wheel setuptools
          pip install maturin[patchelf] pyodide-build

      - name: Patch Cargo.toml
        run: |
          python3 -c '
          with open("Cargo.toml", "r", encoding="utf-8") as f: d = f.read()
          d = d.replace("\"abi3-py39\"", "")
          d = d.replace(", ]", "]")
          with open("Cargo.toml", "w", encoding="utf-8") as f: f.write(d)
          '

      - name: Build WASM Wheel
        run: |
          pyodide build
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezsxf-wasm-wheel
          path: dist/*.whl
