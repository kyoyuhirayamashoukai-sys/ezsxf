name: Build WASM (Pyodide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.45'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Install maturin and pyodide-build
        run: |
          pip install maturin[patchelf] pyodide-build

      - name: Patch files for WASM compatibility (Remove abi3)
        run: |
          python -c "
          import os, re
          def patch_file(fname):
              if not os.path.exists(fname): return
              with open(fname, 'r', encoding='utf-8') as f:
                  data = f.read()
              data = re.sub(r'\"abi3-py39\"', '', data)
              data = data.replace('abi3-py39', '')
              data = data.replace(', ]', ']')
              data = data.replace('[,', '[')
              data = data.replace(', ,', ',')
              with open(fname, 'w', encoding='utf-8') as f:
                  f.write(data)
          patch_file('Cargo.toml')
          patch_file('pyproject.toml')
          "

      - name: Build WASM Wheel
        run: |
          pyodide build
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezsxf-wasm-wheel
          path: dist/*.whl
